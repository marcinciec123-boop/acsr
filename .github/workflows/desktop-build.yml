name: Build desktop app (Windows)

# Every change synced from Lovable lands on main and produces a new signed
# release; installed apps pick it up through the updater (latest.json).
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: desktop-build
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Tauri CLI
        run: npm install --no-save @tauri-apps/cli@^2

      - name: Set version and update endpoint
        shell: bash
        run: |
          node -e "
            const fs=require('fs');const p='src-tauri/tauri.conf.json';
            const c=JSON.parse(fs.readFileSync(p,'utf8'));
            c.version='1.0.${{ github.run_number }}';
            c.plugins.updater.endpoints=['https://github.com/${{ github.repository }}/releases/latest/download/latest.json'];
            fs.writeFileSync(p,JSON.stringify(c,null,2));
          "

      - name: Generate app icons
        run: npx tauri icon public/icon-512.png

      - name: Build, sign and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: v1.0.${{ github.run_number }}
          releaseName: ACSR PORTAL v1.0.${{ github.run_number }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
