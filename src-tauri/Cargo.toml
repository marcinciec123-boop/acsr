[package]
name = "acsr-portal"
version = "1.0.0"
description = "ACSR PORTAL"
edition = "2021"

[lib]
name = "acsr_portal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# crates.io yanked every zip 2.x-8.x release on 2026-10-16, but
# tauri-plugin-updater still requires zip = "^2". Pull 2.2.2 from upstream git.
[patch.crates-io]
zip = { git = "https://github.com/zip-rs/zip2", tag = "v2.2.2" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
