[package]
name = "acsr-portal"
version = "1.0.0"
description = "ACSR PORTAL"
edition = "2021"

[lib]
name = "acsr_portal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Yankowane wersje `zip` (2.x-8.x wycofane z crates.io 2026-10-16) wymuszane
# przez tauri-plugin-updater: pobieramy 2.2.2 bezpoœrednio z repozytorium.
[patch.crates-io]
zip = { git = "https://github.com/zip-rs/zip2", tag = "v2.2.2" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
